<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../default.css">
    <script type="module" src="../scripts/config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>

<body>
<div style="display: flex; flex-direction: row; justify-content: space-between; width: 100%;">
    <div>

    </div>
    <img style="width: 60%" src="../assests/car-front.png">
</div>
<div style="display: flex; flex-direction: row; justify-content: space-between; width: 100%;">
    <div style="width: 50%">
        <h1 style="margin: 0">Drive Modes</h1>
        <div style="display: flex; flex-direction: row; gap: 20px">

        <a class="icon" href="#" id="3"><i class="fa-solid fa-cloud"></i>Comfort</a>

        <a class="icon" href="#" id="0"><i class="fa-solid fa-gear"></i>Individual</a>
        </div>
    </div>
    <div style="width: 50%;text-align: center">
        <h1 style="margin: 0" id="vehicle-name"></h1>
        <h2 style="margin: 0; color: var(--secondary-color-light)" id="vehicle-trim"></h2>
        <h3 style="margin: 0; color: var(--secondary-color-light)" id="engine-specs"></h3>
        <p style="font-size: 32px; margin: 0;color: var(--secondary-color-light)" id="odometer"></p>
